<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
<title id="title">Kiến trúc triển khai portfolio-manh</title><desc id="desc">Nginx chuyển tiếp đến WordPress và MySQL. Prometheus thu metrics từ exporters và cAdvisor, Promtail gửi access logs đến Loki. Grafana hiển thị metrics và logs.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#52718b"/></marker></defs>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#18384e;font-size:19px}.title{font-size:27px;font-weight:700}.sub{font-size:15px;fill:#52687b}.box{fill:white;stroke:#83a4b9;stroke-width:2;rx:12}.app{fill:#eaf8f4}.metrics{fill:#edf3fc}.logs{fill:#fff5e8}.arrow{fill:none;stroke:#52718b;stroke-width:2.5;marker-end:url(#arrow)}.label{font-size:14px;fill:#52687b}</style>
<rect width="1080" height="620" fill="#f8fafc" rx="16"/>
<text x="36" y="42" class="title">Portfolio • Ứng dụng, metrics và access logs</text>
<text x="36" y="69" class="sub">Docker Compose project: portfolio-manh — cổng quản trị bind 127.0.0.1</text>
<rect x="30" y="110" width="180" height="82" class="box app"/><text x="120" y="144" text-anchor="middle">Trình duyệt</text><text x="120" y="173" text-anchor="middle" class="sub">localhost:8080</text>
<rect x="280" y="110" width="190" height="82" class="box app"/><text x="375" y="144" text-anchor="middle">Nginx</text><text x="375" y="173" text-anchor="middle" class="sub">Reverse proxy / headers</text>
<rect x="550" y="110" width="200" height="82" class="box app"/><text x="650" y="144" text-anchor="middle">WordPress / Apache</text><text x="650" y="173" text-anchor="middle" class="sub">Quản trị nội dung</text>
<rect x="850" y="110" width="190" height="82" class="box app"/><text x="945" y="144" text-anchor="middle">MySQL</text><text x="945" y="173" text-anchor="middle" class="sub">portfolio_db / volume</text>
<path d="M210 151 H280" class="arrow"/><path d="M470 151 H550" class="arrow"/><path d="M750 151 H850" class="arrow"/>
<rect x="850" y="228" width="190" height="68" class="box app"/><text x="945" y="255" text-anchor="middle">phpMyAdmin</text><text x="945" y="280" text-anchor="middle" class="sub">localhost:8081</text><path d="M945 228 V192" class="arrow"/>
<rect x="30" y="245" width="180" height="84" class="box metrics"/><text x="120" y="278" text-anchor="middle">cAdvisor</text><text x="120" y="305" text-anchor="middle" class="sub">CPU / RAM container</text>
<rect x="280" y="245" width="190" height="84" class="box metrics"/><text x="375" y="278" text-anchor="middle">nginx-exporter</text><text x="375" y="305" text-anchor="middle" class="sub">stub_status:8088</text><path d="M375 192 V245" class="arrow"/>
<rect x="550" y="245" width="200" height="84" class="box metrics"/><text x="650" y="278" text-anchor="middle">mysqld-exporter</text><text x="650" y="305" text-anchor="middle" class="sub">Queries / threads</text><path d="M850 174 H798 V287 H750" class="arrow"/>
<rect x="30" y="373" width="180" height="78" class="box metrics"/><text x="120" y="404" text-anchor="middle">Blackbox</text><text x="120" y="430" text-anchor="middle" class="sub">HTTP probe website</text>
<rect x="280" y="373" width="190" height="78" class="box metrics"/><text x="375" y="404" text-anchor="middle">Prometheus</text><text x="375" y="430" text-anchor="middle" class="sub">8 jobs • localhost:9090</text>
<path d="M120 329 V348 H375 V373" class="arrow"/><path d="M375 329 V373" class="arrow"/><path d="M650 329 V348 H420 V373" class="arrow"/><path d="M210 412 H280" class="arrow"/>
<rect x="550" y="373" width="200" height="78" class="box logs"/><text x="650" y="404" text-anchor="middle">Promtail</text><text x="650" y="430" text-anchor="middle" class="sub">access.json • mount ro</text>
<rect x="850" y="373" width="190" height="78" class="box logs"/><text x="945" y="404" text-anchor="middle">Loki</text><text x="945" y="430" text-anchor="middle" class="sub">TSDB / filesystem</text>
<path d="M470 181 H515 V392 H550" class="arrow"/><text x="520" y="363" class="label">Access log</text><path d="M750 412 H850" class="arrow"/>
<rect x="420" y="504" width="280" height="78" class="box"/><text x="560" y="535" text-anchor="middle">Grafana • localhost:3000</text><text x="560" y="561" text-anchor="middle" class="sub">Dashboard PromQL và Explore LogQL</text>
<path d="M375 451 V543 H420" class="arrow"/><path d="M945 451 V543 H700" class="arrow"/>
<text x="36" y="594" class="sub">Mạng nội bộ: application, database, monitoring. WordPress dùng outbound cho cập nhật.</text>
</svg>

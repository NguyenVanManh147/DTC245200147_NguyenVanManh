apiVersion: 1
datasources:
  - name: Portfolio Prometheus
    uid: portfolio-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
  - name: Portfolio Loki
    uid: portfolio-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000

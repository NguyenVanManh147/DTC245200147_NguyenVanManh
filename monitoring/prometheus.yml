global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: portfolio-manh
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_project]
        regex: portfolio-manh
        action: keep
  - job_name: nginx
    static_configs:
      - targets: ['nginx-exporter:9113']
  - job_name: mysql
    static_configs:
      - targets: ['mysql-exporter:9104']
  - job_name: portfolio_http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://nginx:80/']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  - job_name: blackbox
    static_configs:
      - targets: ['blackbox:9115']
  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
  - job_name: promtail
    static_configs:
      - targets: ['promtail:9080']

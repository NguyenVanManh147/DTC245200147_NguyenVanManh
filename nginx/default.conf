log_format portfolio_json escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"bytes_sent":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time"}';

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 32m;
    access_log /var/log/portfolio/access.json portfolio_json;
    error_log /var/log/portfolio/error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;

    location = /xmlrpc.php { return 403; }
    location ~ /\. { return 404; }
    location ~* ^/(wp-config\.php|readme\.html|license\.txt)$ { return 404; }
    location / {
        proxy_pass http://wordpress:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Single trusted proxy: discard client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

# No host port mapping for this listener; exporter accesses it on monitoring network.
server {
    listen 8088;
    server_tokens off;
    access_log off;
    location = /stub_status { stub_status; }
    location / { return 404; }
}
